<@_contentSource id=id><#assign a=object/></@_contentSource>
<form method="post" autocomplete="off" action="cmsContentSource/save?callbackType=closeCurrent&navTabId=cmsContentSource/list" class="pageForm required-validate" onsubmit="return validateCallback(this, navTabAjaxDone);">
    <input name="id" type="hidden" value="${id!}"/>
    <input type="hidden" name="_csrf" value="<@_csrfToken admin=true/>"/>
    <div class="formBar card">
        <ul>
            <li><button type="submit" class="buttonActive"><@t.page 'button.save'/></button></li>
            <li><button type="button" class="button close"><@t.page 'button.close'/></button></li>
        </ul>
    </div>
    <div class="card">
        <div class="pageFormContent" layoutH>
            <dl>
                <dt><@t.page 'name'/>:</dt>
                <dd><input class="required" name="name" type="text" size="30" maxlength="100" value="${(a.name)!}"/></dd>
            </dl>
            <dl>
                <dt><@t.page 'url'/>:</dt>
                <dd><input name="url" type="text" size="30" maxlength="200" value="${(a.url)!}"/></dd>
            </dl>
            <dl>
                <dt><@t.page 'initial'/>:</dt>
                <dd><input class="required" name="initial" type="text" size="5" maxlength="5" value="${(a.initial)!}"/></dd>
            </dl>
        </div>
    </div>
</form>
