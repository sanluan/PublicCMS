<@cms.language code=id absoluteURL=false><#assign a=object/></@cms.language>
<form method="post" autocomplete="off" action="cmsLanguage/save?callbackType=closeCurrent&navTabId=cmsLanguage/list" class="pageForm required-validate" onsubmit="return validateCallback(this, navTabAjaxDone);">
    <input type="hidden" name="_csrf" value="<@tools.csrfToken admin=true/>"/>
    <input name="code" type="hidden" value="${id!}"/>
    <div class="formBar card">
        <ul>
            <li><button type="submit" class="buttonActive" title="ctrl+s"><@t.page 'button.save'/></button></li>
            <li><button type="button" class="button close"><@t.page 'button.close'/></button></li>
        </ul>
    </div>
    <div class="card">
        <div class="pageFormContent" layoutH>
        <dl>
            <dt><@t.page 'code'/>:</dt>
            <dd>
                <input class="required" name="id.code" remote="cmsLanguage/virify<#if id?has_content>?oldCode=${(a.id.code)!}</#if>" data-msg-remote="<@t.message 'verify.hasExist.code'/>" maxlength="50" type="text" size="30" value="${(a.id.code)!}"/>
            </dd>
        </dl>
        <dl>
            <dt><@t.page 'name'/>:</dt>
            <dd>
                <input class="required" name="name" type="text" size="30" value="${(a.name)!}"/>
            </dd>
        </dl>
        <dl class="nowrap">
            <dt><@t.page 'cover'/>:</dt>
            <dd>
                <input name="cover" class="preview" value="${(a.cover)!}" maxlength="255" size="50" type="text"/>
                <a class="btnAttach" href="common/upload.html?field=cover&fileTypes=image" lookupGroup="" width="1000" height="600"><@t.page 'cover'/></a>
                <a class="view icon-eye-open" ref="cover" data-prefix="${getFileUploadPrefix()}" href="javascript:void(0);" target="_blank"><@t.page 'button.view'/></a>
            </dd>
        </dl>
        <dl>
            <dt><@t.page 'sort'/>:</dt>
            <dd><input class="required digits" name="sort" type="number" size="4" value="${(a.sort)!0}"/></dd>
        </dl>
    </div>
</form>
