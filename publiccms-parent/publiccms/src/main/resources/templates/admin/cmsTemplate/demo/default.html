<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>New PublicCMS Template</title>
</head>
<body>
    <header data-diy="page">
        <h1>${(site.name)!}</h1>
    </header>
    <main data-diy="page" data-diy-noborder="true">New PublicCMS Template</main>
    <script>
    var templatePath='${.current_template_name?keep_after('/')}';
    </script>
    <#-- footer -->
    <footer>
        Copyright &copy; ${.now?string('yyyy')}
    </footer>
    <script src="${site.dynamicPath}resource/js/cms.support.js"></script>
    <script>
    var ca = cmsAnalytics();
    var url="${site.dynamicPath}api/visit/record";
    if("string" ==typeof itemString){
        url=url+"?"+itemString;
    }
    ca.setDomain("${site.sitePath?keep_after('//')?keep_before('/')?keep_before(':')}");
    ca.setPath("/");
    ca.report(url);
    </script>
    <#-- end footer -->
</body>
</html>
